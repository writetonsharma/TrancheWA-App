spring.application.name=bakery

# Timezone — all date/time logic uses IST (bakery operates in India)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Database
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${POSTGRES_DB:tranche_bakery}
spring.datasource.username=${POSTGRES_USER:bakery}
spring.datasource.password=${POSTGRES_PASSWORD:bakery}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# WhatsApp Cloud API
whatsapp.api.url=https://graph.facebook.com/v19.0
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:tranche-local-2026}
# Language code of the approved Utility templates (used for outside-24h-window fallbacks)
whatsapp.template.language=${WHATSAPP_TEMPLATE_LANG:en}

# Cutoff time (24h format)
bakery.order.cutoff-hour=17

# Max total items bakeable per delivery day
bakery.order.daily-capacity=15
bakery.order.per-order-item-limit=3
bakery.batch-discount.enabled=true

# Admin credentials — change password before going live
admin.username=admin
admin.password=${ADMIN_PASSWORD:tranche2026}

# Telegram admin alerts (optional — set both to enable; reliable, not subject to WhatsApp's 24h window)
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Payment
bakery.payment.upi-id=${BAKERY_UPI_ID:mstranche.eazypay@icici}
bakery.payment.upi-name=${BAKERY_UPI_NAME:Naveen Sharma}
bakery.payment.test-mode=${BAKERY_PAYMENT_TEST_MODE:false}
# Comma-separated phone numbers that get a token ~₹1 QR (live test without real money).
bakery.payment.test-phones=${BAKERY_PAYMENT_TEST_PHONES:}
bakery.admin.phone=${BAKERY_ADMIN_PHONE:9811843373}

# Delivery
bakery.order.delivery-charge=${BAKERY_DELIVERY_CHARGE:65}

# Receipt / bill (business identity shown on customer invoice)
# Non-ASCII escaped as \uXXXX — Spring reads .properties as ISO-8859-1, so literal UTF-8 would mojibake.
bakery.receipt.enabled=${BAKERY_RECEIPT_ENABLED:true}
bakery.receipt.business-name=Tranch\u00e9
bakery.receipt.tagline=Artisan Bakery
bakery.receipt.contact-phone=+91 87967 70308
bakery.receipt.location=Gurugram, Sector-15 \u00b7 Serving DLF Phase 5
bakery.receipt.fssai=20826005005996
