<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscriptions — Tranché Bakery Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f5f0; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .section-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
    .section-card .card-header { border-radius: 8px 8px 0 0; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">🥖 Tranché Bakery — Subscriptions</span>
    <a href="/admin" class="btn btn-sm btn-outline-light">← Dashboard</a>
  </div>
</nav>

<div class="container-fluid px-4">

  <div th:if="${flash}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${flash}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- ── Pending payment ─────────────────────────────────────── -->
  <div class="section-card">
    <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
      <span>Pending Payment — verify UPI, then activate</span>
      <span class="badge bg-dark text-white" th:text="${pending.size()} + ' pending'"></span>
    </div>
    <div class="card-body p-0">
      <div th:if="${pending.isEmpty()}" class="p-3 text-muted">No subscriptions awaiting activation.</div>
      <div th:unless="${pending.isEmpty()}" class="table-responsive">
        <table class="table table-sm table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Customer</th><th>Plan</th><th>Bundle</th><th>Day</th><th>Upfront</th><th>Requested</th><th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="s : ${pending}">
              <td>
                <span th:text="${s.customer.name ?: '—'}"></span><br>
                <small class="text-muted" th:text="${s.customer.phone}"></small>
              </td>
              <td>
                <span th:text="${s.planName}"></span>
                <span class="badge bg-secondary" th:text="${s.tier}"></span>
              </td>
              <td>
                <span th:each="it : ${s.items}" class="d-block small"
                      th:text="(${it.quantity} > 1 ? it.quantity + '× ' : '') + it.itemName + (${it.portion} == 'HALF' ? ' (½)' : '')"></span>
              </td>
              <td th:text="${s.deliveryDay}"></td>
              <td th:text="'₹' + ${s.upfrontAmount}"></td>
              <td><small th:text="${#temporals.format(s.createdAt, 'd MMM, HH:mm')}"></small></td>
              <td class="text-nowrap">
                <form th:action="@{/admin/subscriptions/{id}/approve(id=${s.id})}" method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm btn-success"
                          onclick="return confirm('Confirm you have received the UPI payment, then activate?')">Approve &amp; Activate</button>
                </form>
                <form th:action="@{/admin/subscriptions/{id}/cancel(id=${s.id})}" method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm btn-outline-danger"
                          onclick="return confirm('Cancel this subscription request?')">Cancel</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Active ──────────────────────────────────────────────── -->
  <div class="section-card">
    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
      <span>Active Subscriptions</span>
      <span class="badge bg-dark text-white" th:text="${active.size()} + ' active'"></span>
    </div>
    <div class="card-body p-0">
      <div th:if="${active.isEmpty()}" class="p-3 text-muted">No active subscriptions.</div>
      <div th:unless="${active.isEmpty()}" class="table-responsive">
        <table class="table table-sm table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Customer</th><th>Plan</th><th>Bundle</th><th>Day</th><th>From</th><th>Until</th><th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="s : ${active}">
              <td>
                <span th:text="${s.customer.name ?: '—'}"></span><br>
                <small class="text-muted" th:text="${s.customer.phone}"></small>
              </td>
              <td>
                <span th:text="${s.planName}"></span>
                <span class="badge bg-secondary" th:text="${s.tier}"></span>
              </td>
              <td>
                <span th:each="it : ${s.items}" class="d-block small"
                      th:text="(${it.quantity} > 1 ? it.quantity + '× ' : '') + it.itemName + (${it.portion} == 'HALF' ? ' (½)' : '')"></span>
              </td>
              <td th:text="${s.deliveryDay}"></td>
              <td><small th:text="${s.startDate != null ? #temporals.format(s.startDate, 'd MMM') : '—'}"></small></td>
              <td><small th:text="${s.endDate != null ? #temporals.format(s.endDate, 'd MMM') : '—'}"></small></td>
              <td>
                <form th:action="@{/admin/subscriptions/{id}/cancel(id=${s.id})}" method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm btn-outline-danger"
                          onclick="return confirm('Cancel this active subscription? Remaining weeks will stop.')">Cancel</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
