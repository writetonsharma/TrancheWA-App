<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Customer — ' + (${customer.name} != null ? ${customer.name} : ${customer.phone})">Customer — Tranché Bakery Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f5f0; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .section-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
    .section-card .card-header { border-radius: 8px 8px 0 0; font-weight: 600; }
    dt { color: #6c757d; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">🥖 Tranché Bakery — Customer</span>
    <div class="d-flex align-items-center gap-2">
      <a href="/admin/customers" class="btn btn-sm btn-outline-light">← Customers</a>
      <a href="/admin" class="btn btn-sm btn-outline-light">Dashboard</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Flash messages -->
  <div th:if="${flash}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${flash}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row">
    <div class="col-lg-7">
      <div class="section-card">
        <div class="card-header bg-primary text-white">Edit Details</div>
        <div class="card-body">
          <form th:action="@{/admin/customers/{id}(id=${customer.id})}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" name="name" class="form-control" th:value="${customer.name}" placeholder="e.g. Naveen">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Phone (WhatsApp, with country code)</label>
              <input type="text" name="phone" class="form-control" th:value="${customer.phone}" required>
              <div class="form-text">This is the customer's WhatsApp identity. Only change it to correct a typo.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Delivery Area</label>
              <input type="text" name="deliveryArea" class="form-control" th:value="${customer.deliveryArea}" placeholder="e.g. DLF Phase 5">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Delivery Address</label>
              <textarea name="deliveryAddress" class="form-control" rows="3" th:text="${customer.deliveryAddress}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="section-card">
        <div class="card-header bg-light">Account</div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-5">Customer ID</dt>
            <dd class="col-7" th:text="${customer.id}"></dd>
            <dt class="col-5">Flat Rate</dt>
            <dd class="col-7" th:text="${customer.pricingOverride != null ? '₹' + customer.pricingOverride : '—'}"></dd>
            <dt class="col-5">Free Delivery</dt>
            <dd class="col-7" th:text="${customer.freeDelivery ? 'Yes' : 'No'}"></dd>
            <dt class="col-5">Joined</dt>
            <dd class="col-7" th:text="${#temporals.format(customer.createdAt, 'd MMM yyyy, HH:mm')}"></dd>
            <dt class="col-5">Updated</dt>
            <dd class="col-7" th:text="${#temporals.format(customer.updatedAt, 'd MMM yyyy, HH:mm')}"></dd>
          </dl>
          <hr>
          <div class="d-grid gap-2">
            <a th:href="@{/admin/orders(customer=${customer.phone})}" class="btn btn-outline-secondary btn-sm">View orders</a>
            <a href="/admin/pricing" class="btn btn-outline-warning btn-sm">Manage pricing override</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
