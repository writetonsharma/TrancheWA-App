<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers — Tranché Bakery Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f5f0; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; }
    .section-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
    .section-card .card-header { border-radius: 8px 8px 0 0; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">🥖 Tranché Bakery — Customers</span>
    <div class="d-flex align-items-center gap-2">
      <a href="/admin/pricing" class="btn btn-sm btn-outline-warning">₹ Pricing</a>
      <a href="/admin" class="btn btn-sm btn-outline-light">← Dashboard</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- Flash messages -->
  <div th:if="${flash}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${flash}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="section-card">
    <div class="card-header bg-primary text-white">Customer Directory</div>
    <div class="card-body">
      <form th:action="@{/admin/customers}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" name="q" class="form-control" placeholder="Search by name or phone" th:value="${q}">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Search</button>
          <a href="/admin/customers" class="btn btn-outline-secondary">Clear</a>
        </div>
      </form>

      <div th:if="${customers.isEmpty()}" class="text-muted">No customers found.</div>
      <div th:unless="${customers.isEmpty()}" class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Delivery Area</th>
              <th>Flat Rate</th>
              <th>Since</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${customers}">
              <td th:text="${c.name != null ? c.name : '—'}"></td>
              <td th:text="${c.phone}"></td>
              <td th:text="${c.deliveryArea != null ? c.deliveryArea : '—'}"></td>
              <td th:text="${c.pricingOverride != null ? '₹' + c.pricingOverride : '—'}"></td>
              <td th:text="${#temporals.format(c.createdAt, 'd MMM yyyy')}"></td>
              <td class="text-end">
                <a th:href="@{/admin/customers/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">View / Edit</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
